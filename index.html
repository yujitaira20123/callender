<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <h1>カレンダーアプリ</h1>
    </head> 
    

    <body>
        <script type="module" src="script.js" defer></script>
        <div id="calender-box">
        <div id = "header">
            <button id="prev">←</button>
            <h1 id="nowmonth"></h1>
            <button id="next">→</button>
        </div>
        <table>
            <thead>
            <tr>
                <th id ="日">日</th>
                <th>月</th>
                <th>火</th>
                <th>水</th>
                <th>木</th>
                <th>金</th>
                <th id ="土">土</th>
            </tr>
            </thead>
            <tbody id="calender"></tbody>
        </table>
        </div>
        <div id ="modal">
            <div id ="modalContent">
                <h2>予定入力</h2>
                <input type="text" id = "planImput">
                <button id="saveButton">保存</button>
                <button id = "closeButton">閉じる</button>
                <div id ="moneysend">
                <h2>支出</h2>
                <input type="number" id = "moneyminus">円
                <h2>収入</h2>
                <input type="number" id = "moneyplus">円
                <button id = "moneyplusminussend">保存</button>
                </div>
            </div>
        </div>
                
    </body>   


</html>
